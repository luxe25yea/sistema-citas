server:
  port: 8081

spring:
  application:
    name: patient-service

  datasource:
    url: jdbc:h2:mem:patients
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console
